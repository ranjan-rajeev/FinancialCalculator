# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=8192m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Legacy Java sources use `switch (view.getId()) { case R.id.foo: ... }`, which
# requires final resource IDs. AGP 9 defaults this to true. Safe to remove once
# the last switch-on-view-id is converted to Kotlin `when`.
android.nonFinalResIds=false

# `com.financialcalculator` enables BuildConfig explicitly via
# `buildFeatures.buildConfig = true`, because `BuildConfig.HOST` is still read by
# the network layer. The old global `android.defaults.buildfeatures.buildconfig`
# flag was removed in AGP 9.0.

# Kotlin
kotlin.code.style=official

# Debug configuration
DEBUG_SPLASH_WAIT_TIME_IN_SECONDS=2000
DEBUG_IS_IN_DEBUG_MODE=true
DEBUG_HOST=https://ranjan-rajeev.github.io

# Release configuration
RELEASE_SPLASH_WAIT_TIME_IN_SECONDS=2000
RELEASE_IS_IN_DEBUG_MODE=false
RELEASE_HOST=https://ranjan-rajeev.github.io