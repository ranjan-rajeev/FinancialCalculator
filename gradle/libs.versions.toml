[versions]
# Build toolchain
agp = "9.3.3"
kotlin = "2.4.20"
ksp = "2.3.12"

# SDK levels
# compileSdk 37 is required by Compose 1.12.x (pulled in via the BOM).
# targetSdk stays at 36: compileSdk only gates API availability, while targetSdk
# opts the app into new runtime behaviour. Keeping targetSdk at 36 preserves the
# existing runtime semantics during the Compose migration.
compileSdk = "37"
targetSdk = "36"
minSdk = "24"

# AndroidX
androidxCore = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
swiperefreshlayout = "1.2.0"
cardview = "1.0.0"
activity = "1.11.0"
fragment = "1.8.9"
lifecycle = "2.9.4"
coreKtx = "1.17.0"

# Compose
composeBom = "2026.09.00"

# DI
hilt = "2.56.2"
hiltNavigationCompose = "1.3.0"

# Persistence
room = "2.8.5"
datastore = "1.1.7"

# Navigation
navigationCompose = "2.10.2"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"

# Legacy networking stack (removed in the Retrofit/RxJava phase)
rxjava = "2.2.21"
rxandroid = "2.1.1"
gson = "2.11.0"

# Images
glide = "4.16.0"

# Serialization
kotlinxSerialization = "1.9.0"

# Images
coil = "3.3.0"

# Legacy image loading (removed in the Coil phase)
glideLegacy = "4.16.0"

# Google Play
playAppUpdate = "2.1.0"

# Coroutines
coroutines = "1.10.2"

# Testing
junit = "4.13.2"
mockito = "5.14.2"
mockitoKotlin = "5.4.0"
turbine = "1.2.0"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"

[libraries]
# AndroidX core
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Material
material = { module = "com.google.android.material:material", version.ref = "material" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# DI
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Persistence
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
retrofit-adapter-rxjava2 = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" }
retrofit-adapter-rxjava = { module = "com.squareup.retrofit2:adapter-rxjava", version.ref = "retrofit" }
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Images
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Legacy image loading
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glideLegacy" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glideLegacy" }

# Google Play
play-app-update = { module = "com.google.android.play:app-update-ktx", version.ref = "playAppUpdate" }
play-app-update-legacy = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }

# Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version = "2.2.0" }

[plugins]
# NOTE: `org.jetbrains.kotlin.android` is intentionally absent. Since AGP 9.0
# Kotlin support is built into `com.android.application` and enabled by
# default; applying the Kotlin Android plugin alongside it is a hard error.
# The Kotlin Gradle Plugin version is pinned on the root buildscript classpath
# instead (see build.gradle.kts).
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# NOTE: KSP and Hilt are deferred to the Room/DI phase. KSP has not published a
# build matching Kotlin 2.4.20 yet (latest is 2.3.12), and AGP 9 forces KSP to
# match the KGP version. `org.jetbrains.kotlin.kapt` is also incompatible with
# built-in Kotlin. Room therefore still uses `annotationProcessor` for now.